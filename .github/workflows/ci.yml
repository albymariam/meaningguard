name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Light dependencies only: tests must not need torch or model downloads.
      - run: pip install pytest hypothesis pyyaml ruff
      - run: ruff check .
      - run: pytest -q
